<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Health Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h2>🖥️ System Health Dashboard</h2>
            <p class="text-muted">Real-time automated system monitoring</p>
        </div>

        <div class="row text-center mb-4">
            <!-- CPU Usage -->
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm p-3">
                    <h4>CPU Usage</h4>
                    <h2 id="cpu-val" class="text-primary">{{ cpu }}%</h2>
                </div>
            </div>
            <!-- RAM Usage -->
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm p-3">
                    <h4>RAM Usage</h4>
                    <h2 id="ram-val" class="text-success">{{ ram }}%</h2>
                </div>
            </div>
            <!-- Disk Usage -->
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm p-3">
                    <h4>Disk Usage</h4>
                    <h2 id="disk-val" class="text-warning">{{ disk }}%</h2>
                </div>
            </div>
        </div>

        <!-- Button and Status Message -->
        <div class="text-center">
            <form action="{% url 'health_check' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg">Run Health Check & Notify Slack</button>
            </form>

            {% if status_message %}
                <div class="mt-3 alert alert-{{ message_color }}" role="alert">
                    {{ status_message }}
                </div>
            {% endif %}
        </div>
    </div>

    <!-- Auto-Refresh JavaScript Code -->
    <script>
        setInterval(function() {
            fetch('/api/stats/')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('cpu-val').innerText = data.cpu + '%';
                    document.getElementById('ram-val').innerText = data.ram + '%';
                    document.getElementById('disk-val').innerText = data.disk + '%';
                })
                .catch(error => console.error('Error fetching stats:', error));
        }, 5000); // Har 5 second mein automatic update hoga
    </script>
</body>
</html>
